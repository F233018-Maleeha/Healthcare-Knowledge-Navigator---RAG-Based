version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hkn
      POSTGRES_PASSWORD: hkn
      POSTGRES_DB: hkn
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hkn -d hkn"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - VECTOR_BACKEND=qdrant
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_DSN=postgresql+asyncpg://hkn:hkn@postgres:5432/hkn
      - REDIS_URL=redis://redis:6379/0
    # Automated background ingestion on startup
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 &
             sleep 5 &&
             python scripts/ingest_dailymed.py --api-url http://localhost:8000 --batch-size 5 &&
             wait"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  pg_data:
  qdrant_data: